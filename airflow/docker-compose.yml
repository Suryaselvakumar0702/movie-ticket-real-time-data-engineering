services:

  airflow-init:
    image: apache/airflow:3.0.6
    container_name: movie-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-db:/opt/airflow
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "
      airflow db migrate
      "

  airflow-webserver:
    image: apache/airflow:3.0.6
    container_name: movie-airflow-webserver
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"

      MYSQL_HOST: "host.docker.internal"
      MYSQL_PORT: "3306"

    env_file:
      - ../.env
    volumes:
      - airflow-db:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/project
    command: api-server

  airflow-scheduler:
    image: apache/airflow:3.0.6
    container_name: movie-airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"

      MYSQL_HOST: "host.docker.internal"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "movie_ticket_db"
      MYSQL_USER: "root"

    env_file:
      - ../.env
    volumes:
      - airflow-db:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/project
    command: scheduler

  airflow-dag-processor:
    image: apache/airflow:3.0.6
    container_name: movie-airflow-dag-processor
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - airflow-db:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ..:/opt/project
    command: dag-processor

volumes:
  airflow-db: